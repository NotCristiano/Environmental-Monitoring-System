apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: metriclab-ingestion:local
          imagePullPolicy: Never
          env:
            - name: SERVER_ADDRESS
              value: 0.0.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
# shortcut: TCP connections stay on one pod, use an HTTP proxy if per-request balancing is needed.
spec:
  selector:
    app: ingestion
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion
  minReplicas: 1
  maxReplicas: 1000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
